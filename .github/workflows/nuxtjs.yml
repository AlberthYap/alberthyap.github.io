name: Deploy Nuxt site to Pages

# Trigger on every push to v2. Manual dispatch is also enabled so the
# workflow can be re-run from the Actions tab without a new commit.
on:
  push:
    branches: ["v2"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# `id-token: write` is required for OIDC-based deploy-pages authentication.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do NOT cancel in-progress
# runs — production deployments should always finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job — runs typecheck + unit tests first, then static export.
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — Nuxt 4.5 / Nitro 2.13 are tested on Node 22.
          # better-sqlite3@12 has prebuilt binaries for node22-linux-x64.
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Sync lockfile if drifted
        # `npm ci` is strict: it errors out if package.json + lockfile
        # disagree. If a contributor committed a package.json change
        # without running `npm install`, `npm ci` fails with
        # "Missing: <pkg>@<ver> from lock file".
        # `npm install --package-lock-only --ignore-scripts` rewrites
        # the lockfile in-place to match package.json without touching
        # node_modules. --ignore-scripts is required because
        # postinstall: nuxt prepare runs nuxt CLI, which isn't
        # installed yet in --package-lock-only mode (causes
        # "sh: nuxt: not found" → exit 127).
        # Safe to keep: if the lockfile is already in sync, this is a
        # near-no-op (npm exits without writing).
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        # `nuxi typecheck` reads .nuxt/tsconfig.json, which
        # `postinstall: nuxt prepare` (run by `npm ci`) generated.
        # Fails the build on any type error before we generate HTML.
        run: npx nuxt typecheck

      - name: Unit tests
        # 32 vitest files, happy-dom env, no network, no env vars.
        # Fails the build if any unit test fails.
        run: npm run test:unit

      - name: Static HTML export with Nuxt
        # `nuxt generate` writes pure static output to .output/public/
        # (no .output/server/). nitro.prerender.failOnError: true in
        # nuxt.config.ts surfaces broken internal links as a build
        # failure.
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Nuxt 4 generate output, NOT ./dist (which is a stale symlink
          # from the Nuxt 2/3 docs template).
          path: .output/public

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
