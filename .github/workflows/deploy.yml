name: Deploy v2 to GitHub Pages

# Trigger on every push to v2. Manual dispatch is also enabled so the
# workflow can be re-run from the Actions tab without a new commit.
on:
  push:
    branches: [v2]
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new commit lands.
# Saves Pages build quota and runner minutes.
concurrency:
  group: pages-v2
  cancel-in-progress: true

# Minimal permissions: read repo, deploy to Pages, OIDC for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Cap the job at 15 minutes. nuxt generate + Pages upload usually finish
# in < 3 minutes; 15 leaves headroom for cold cache + slow runners.
jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # `nuxi typecheck` reads .nuxt/tsconfig.json (generated by
        # `postinstall: nuxt prepare`, which `npm ci` already ran).
        run: npx nuxt typecheck

      - name: Unit tests
        # 32 vitest files, happy-dom env, no network, no env vars.
        # Fails the job before we ever touch Pages.
        run: npm run test:unit

      - name: Generate static site
        # `nuxt generate` writes .output/public/ as pure static HTML
        # (no .output/server/). nitro.prerender.failOnError: true
        # surfaces broken internal links as a build failure.
        run: npm run generate

      - name: Configure Pages
        # Detects base URL from the repo (user site → root "/") and
        # creates the github-pages environment if missing.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
